name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create a GitHub Release on v* tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Game logic tests
        run: node test/logic.test.js

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set - building an UNSIGNED release"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release AAB + APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Collect outputs
        id: out
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/ball-sort-puzzle-v$VERSION.aab"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "dist/ball-sort-puzzle-v$VERSION.apk"
          ls -la dist
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs dist/*.apk | head -5
          fi
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ball-sort-puzzle-aab
          path: dist/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ball-sort-puzzle-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ball Sort Puzzle ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.aab
            dist/*.apk
